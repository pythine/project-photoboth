<!DOCTYPE html>
<html><body style="font-family:sans-serif;text-align:center;padding:30px;background:#121214;color:#fff">
<h3>Pembuat ikon</h3>
<canvas id="c" width="512" height="512" style="width:200px;border-radius:40px"></canvas><br><br>
<button onclick="dl(192)">⬇ icon-192.png</button>
<button onclick="dl(512)">⬇ icon-512.png</button>
<script>
function draw(s){
  const c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,s,s);g.addColorStop(0,'#ff4757');g.addColorStop(1,'#ff6b9d');
  x.fillStyle=g;x.fillRect(0,0,s,s);                       // latar penuh (aman untuk ikon "maskable")
  const t=s*.2;x.fillStyle='#fff';x.beginPath();x.moveTo(s/2,s*.68);
  x.bezierCurveTo(s/2-t*2.2,s*.5,s/2-t*1.3,s*.3,s/2,s*.42);
  x.bezierCurveTo(s/2+t*1.3,s*.3,s/2+t*2.2,s*.5,s/2,s*.68);x.fill();
  x.font=`600 ${s*.11}px sans-serif`;x.textAlign='center';x.fillText('BOOTH',s/2,s*.84);
  return c;
}
document.getElementById('c').getContext('2d').drawImage(draw(512),0,0);
function dl(s){const a=document.createElement('a');a.download='icon-'+s+'.png';a.href=draw(s).toDataURL('image/png');a.click()}
</script></body></html>
