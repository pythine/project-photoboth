/* HEADER */
.header{height:60px;background:#0b1014;display:flex;align-items:center;justify-content:space-between;padding:0 15px;position:sticky;top:0}

  position:relative;
}
/* BUBBLE MOOD */
.mood-wrap{display:flex;justify-content:center;margin-top:10px}
.mood{background:#18252e;color:#8696a0;padding:8px 14px;border-radius:20px 20px 20px 0;font-size:13px;position:relative}
.mood::after{content:'';position:absolute;bottom:-6px;left:20px;width:10px;height:10px;background:#18252e;transform:rotate(45deg)}
/* AVATAR */
.avatar-wrap{display:flex;justify-content:center;margin-top:15px}
.avatar{width:145px;height:145px;border-radius:50%;object-fit:cover;border:4px solid #0b1014}
.name-wrap{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:18px}
.name{font-family:'Amiri', serif;font-size:32px;color:#fff}
.arrow{color:#8696a0;font-size:14px}

/* LIST MENU */

.item{display:flex;align-items:center;padding:18px 16px;gap:22px;border-bottom:0.5px solid #1f2c34}
.item:active{background:#1f2c34}
.item .icon{color:#8696a0;width:24px;height:24px}
.item .icon svg{width:24px;height:24px;fill:#8696a0}
.text h4{font-size:17px;font-weight:400;color:#e9edef}
.text p{font-size:13px;color:#8696a0;margin-top:3px}
.dot{margin-left:auto;width:14px;height:14px;background:#00a884;border-radius:50%}
.sosial{margin-left:auto;width:50px;height:50px;border-radius:50%;overflow:hidden}
img{width:100%;height:100%;object-fit:cover;border:1px solid black;box-shadow:0 0 25px yellow;}
